# Cloud Build: on push to main, build the image and deploy testlane-web to Cloud Run.
substitutions:
  _REGION: europe-west2
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/testlane/testlane-web:$BUILD_ID",
           "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/testlane/testlane-web:latest", "."]
  - name: gcr.io/cloud-builders/docker
    id: push
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/testlane/testlane-web"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-service
    entrypoint: gcloud
    args: ["run", "deploy", "testlane-web",
           "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/testlane/testlane-web:$BUILD_ID",
           "--region", "${_REGION}", "--platform", "managed",
           "--allow-unauthenticated",
           "--min-instances", "0", "--max-instances", "5",
           "--memory", "512Mi", "--cpu", "1",
           "--set-env-vars", "^:^DJANGO_DEBUG=False:ALLOWED_HOSTS=testlane.ai,www.testlane.ai,.a.run.app"]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/testlane/testlane-web:$BUILD_ID"
timeout: 600s
