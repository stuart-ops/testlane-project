# render.yaml — Testlane.ai Sovereign AI Platform
# Cloud Run deployment via Docker — this file is for Render fallback only.

services:
  - type: web
    name: testlane-sovereign-site
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn semilattice_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "testlane.ai,www.testlane.ai"